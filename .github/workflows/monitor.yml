name: Bid Searcher GPO

on:
  schedule:
    # Lunes a viernes, cada hora de 7 a. m. a 7 p. m. hora del Este
    # (11-23 UTC cubre verano e invierno; el script descarta lo que sobre).
    # Minuto 17 en vez de 0 porque GitHub retrasa más las corridas en punto.
    - cron: "17 11-23 * * 1-5"
  workflow_dispatch: {}   # botón "Run workflow" para probar a mano
  push:
    paths: [mis_bids.txt] # al editar mis_bids.txt, corre y confirma por correo

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-24.04   # fijo en 24.04 para evitar el cambio automático a Ubuntu 26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar GPO
        env:
          CRON_SCHEDULE: ${{ github.event.schedule }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python monitor.py

      - name: Guardar estado
        run: |
          git config user.name "bot-monitor"
          git config user.email "bot-monitor@users.noreply.github.com"
          git add state/gpo.json mis_bids_estado.md
          git diff --cached --quiet && exit 0
          git commit -m "Actualizar estado de GPO"
          git pull --rebase
          git push
